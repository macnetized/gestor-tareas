<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0">Gestor de Tareas</h1>
    @if (!mostrarFormulario()) {
      <button class="btn btn-primary" (click)="nuevaTarea()">
        <i class="bi bi-plus-lg"></i> Añadir tarea
      </button>
    }
  </div>

  @if (mostrarFormulario()) {
    <app-tarea-form
      [tarea]="tareaEditando()"
      (guardada)="alGuardar()"
      (cancelada)="alCancelar()"
    />
  }

  <app-tarea-list (editar)="editar($event)" (borrada)="alBorrar($event)" />
</div>
