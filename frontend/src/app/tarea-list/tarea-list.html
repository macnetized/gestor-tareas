<h2 class="mb-3">Mis tareas</h2>

@if (cargando()) {
  <p>Cargando tareas...</p>
}

@if (error()) {
  <div class="alert alert-danger">{{ error() }}</div>
}

@if (!cargando() && tareas().length === 0) {
  <p class="text-muted">Todavía no hay tareas.</p>
}

<ul class="list-group">
  @for (tarea of tareas(); track tarea.id) {
      <li
        class="list-group-item d-flex justify-content-between align-items-center"
        [class.tarea-editando]="tarea.id === editandoId()"
        >
      <div>
        <h5 class="mb-1">{{ tarea.titulo }}</h5>
        <p class="mb-0">{{ tarea.descripcion }}</p>
      </div>
      <div class="d-flex gap-2 ms-3">
        <button
          class="btn btn-sm"
          [class.btn-primary]="tarea.id === editandoId()"
          [class.btn-outline-primary]="tarea.id !== editandoId()"
          title="Editar"
          aria-label="Editar tarea"
          (click)="editar.emit(tarea)"
        >
          <i class="bi bi-pencil-square"></i>
        </button>
        <button
          class="btn btn-outline-danger btn-sm"
          title="Borrar"
          aria-label="Borrar tarea"
          (click)="borrar(tarea.id!)"
        >
          <i class="bi bi-trash"></i>
        </button>
      </div>
    </li>
  }
</ul>
