<h2 class="mb-3">Mis tareas</h2>

@if (cargando()) {
  <p>Cargando tareas...</p>
}

@if (error()) {
  <div class="alert alert-danger">{{ error() }}</div>
}

@if (!cargando() && tareas().length === 0) {
  <p class="text-muted">Todavía no hay tareas.</p>
}

<ul class="list-group">
  @for (tarea of tareas(); track tarea.id) {
    <li class="list-group-item d-flex justify-content-between align-items-start">
      <div>
        <h5 class="mb-1">{{ tarea.titulo }}</h5>
        <p class="mb-0">{{ tarea.descripcion }}</p>
      </div>
      <button class="btn btn-outline-danger btn-sm" (click)="borrar(tarea.id!)">
        Borrar
      </button>
    </li>
  }
</ul>
